<!DOCTYPE html>
<html>
  <head>
    <title>YOLO no Celular - FUNCIONANDO!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #000;
        text-align: center;
        font-family: Arial;
        color: white;
      }
      video,
      canvas {
        width: 100%;
        max-width: 640px;
        border: 4px solid lime;
        border-radius: 12px;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
      }
      #status {
        padding: 15px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>YOLOv8n no Celular</h1>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="status">Carregando...</div>

    <script>
      // MUDE AQUI PARA O SEU LINK DO NGROK!
      const NGROK_URL = 'https://evan-noncollectible-jamie.ngrok-free.dev';

      const socket = io(NGROK_URL, {
        transports: ['websocket'],
        reconnection: true,
        reconnectionAttempts: 5
      });

      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const status = document.getElementById('status');

      socket.on('connect', () => {
        console.log('1. Socket.IO conectado com sucesso!');
        status.innerHTML = '<p style="color:lime">Conectado! Abrindo câmera...</p>';
      });

      socket.on('connect_error', (err) => {
        console.log('ERRO DE CONEXÃO: ' + err.message);
        status.innerHTML = `<p style="color:red">Erro de conexão: ${err.message}</p>`;
      });

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: {ideal: 640}, height: {ideal: 480} }
      })
      .then(stream => {
        video.srcObject = stream;
        video.play();
        console.log('2. Câmera aberta com sucesso!');
        status.innerHTML = '<p style="color:lime">Câmera OK! Enviando frames...</p>';
      })
      .catch(err => {
        console.log('ERRO NA CÂMERA: ' + err.message);
        status.innerHTML = `<p style="color:red">Câmera bloqueada: ${err.message}</p>`;
      });

      // Envio de frame
      setInterval(() => {
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const base64 = canvas.toDataURL('image/jpeg', 0.4);
          socket.emit('frame', { image: base64 });
          console.log('3. Frame enviado! Tamanho: ' + base64.length);
        }
      }, 500);  // 500ms para FPS melhor

      socket.on('detection_result', (data) => {
        console.log('4. Resultado recebido do backend!');
        console.log(data);

        if (data.success && data.total > 0) {
          status.innerHTML = `<p style="color:lime">${data.total} objeto(s) detectado(s)!</p>`;

          // Desenho de bounding boxes
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          data.bboxes.forEach(b => {
            ctx.strokeStyle = 'lime';
            ctx.lineWidth = 4;
            ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
            ctx.fillStyle = 'lime';
            ctx.font = '20px Arial';
            ctx.fillText(`${b.class} ${b.conf}`, b.x1 + 8, b.y1 + 28);
          });
        } else if (data.success) {
          status.innerHTML = '<p style="color:orange">Nenhum objeto detectado</p>';
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        } else {
          status.innerHTML = `<p style="color:red">Erro: ${data.error}</p>`;
        }
      });
    </script>
  </body>
</html>
